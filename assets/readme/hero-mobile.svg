<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MathArts Core：阴阳、五行、干支的 Rust 基础库</title>
  <desc id="desc">手机布局。十天干与十二地支同步步进，六十步回到甲子；圆环包含六十个刻度。</desc>
  <rect width="600" height="400" rx="16" fill="#F4F0E7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <path d="M36 32H62" stroke="#AC432F" stroke-width="4"/>
    <text x="32" y="96" fill="#242B28" font-size="57" font-weight="650" letter-spacing="-2">MathArts<tspan fill="#AC432F">/</tspan>core</text>
    <text x="36" y="141" fill="#242B28" font-size="27">阴阳、五行、干支的 Rust 基础库</text>
    <g fill="#666D64" font-size="28">
      <text x="40" y="215">10 天干</text>
      <text x="40" y="258">12 地支</text>
      <text x="40" y="301" fill="#AC432F">60 甲子</text>
    </g>
    <path d="M36 336H564" stroke="#D4CEC1"/>
    <text x="36" y="375" fill="#666D64" font-size="23" font-family="ui-monospace, Menlo, monospace">no_std · serde optional</text>
  </g>
  <g transform="translate(443 248)">
    <circle r="73" stroke="#C9C4B7" stroke-width="10" pathLength="60" stroke-dasharray="0.14 0.86" transform="rotate(-90)"/>
    <circle r="56" stroke="#D4CEC1"/>
    <path d="M0 -81V-65" stroke="#AC432F" stroke-width="4"/>
    <text y="17" text-anchor="middle" fill="#242B28" font-size="48" font-family="'Songti SC', 'Noto Serif CJK SC', serif">甲子</text>
  </g>
</svg>
